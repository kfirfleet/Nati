<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חוברת הפגמים של נתי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a67a3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פגמים">

<style>
:root{
  /* Layout: sticky search + family chips on top, accordion cards below, full-screen page viewer on tap.
     Colors echo the booklet: cyan table lines, yellow/orange footer bars. */
  --bg:#f2f5f8;
  --surface:#ffffff;
  --ink:#14263a;
  --muted:#586979;
  --line:#d8e0e7;
  --accent:#0a67a3;
  --accent-ink:#ffffff;
  --accent-soft:#e1eff8;
  --mark:#ffe26a;
  --mark-ink:#14263a;
  --bar:#f6c618;
  --bar2:#f39a1e;
  --s1:#2a9556; --s1i:#fff;
  --s2:#78a82a; --s2i:#fff;
  --s3:#e9b923; --s3i:#2a2000;
  --s4:#df7a1b; --s4i:#fff;
  --s5:#c8372d; --s5i:#fff;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1822;
    --surface:#16232f;
    --ink:#e8eef3;
    --muted:#9fb1c0;
    --line:#2a3b4b;
    --accent:#5db5ee;
    --accent-ink:#06202f;
    --accent-soft:#17384e;
    --mark:#7d6a12;
    --mark-ink:#fff8d6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1822;
  --surface:#16232f;
  --ink:#e8eef3;
  --muted:#9fb1c0;
  --line:#2a3b4b;
  --accent:#5db5ee;
  --accent-ink:#06202f;
  --accent-soft:#17384e;
  --mark:#7d6a12;
  --mark-ink:#fff8d6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.stripe{height:6px;background:linear-gradient(to left,var(--bar) 0 50%,var(--bar2) 50% 100%)}
.top-in{padding:14px 16px 12px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.2;text-wrap:balance}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}

.sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.sticky-in{max-width:760px;margin:0 auto;padding:10px 16px 8px}
.field{position:relative}
.field svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
#q{width:100%;height:54px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0 48px;font:inherit;font-size:18px;font-weight:500;appearance:none;-webkit-appearance:none}
#q::placeholder{color:var(--muted);font-weight:400;font-size:16px}
#q:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
#q::-webkit-search-cancel-button{display:none}
#clear{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;border-radius:50%;color:var(--muted);display:none;align-items:center;justify-content:center}
#clear.on{display:flex}
#clear svg{position:static;transform:none;width:20px;height:20px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap;min-height:36px}
.chip b{font-weight:700;margin-inline-start:5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.85}

main{max-width:760px;margin:0 auto;padding:12px 16px 48px}
.statusbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin:2px 0 12px;font-size:14px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.l1{background:var(--s1);color:var(--s1i)} .l2{background:var(--s2);color:var(--s2i)} .l3{background:var(--s3);color:var(--s3i)} .l4{background:var(--s4);color:var(--s4i)} .l5{background:var(--s5);color:var(--s5i)}

.group-h{margin:20px 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ink)}
.group-h::before{content:"";width:10px;height:22px;border-radius:3px;background:linear-gradient(var(--bar) 0 50%,var(--bar2) 50% 100%)}
.group-h small{font-weight:400;color:var(--muted);direction:ltr}
.list{display:flex;flex-direction:column;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:start;padding:12px 14px;min-height:64px}
.code{direction:ltr;unicode-bidi:isolate;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);padding:4px 8px;border-radius:8px;letter-spacing:.02em}
.ttl{font-size:17px;font-weight:700;line-height:1.3;text-wrap:balance}
.en{font-size:13px;color:var(--muted);margin-top:1px}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.chev{width:22px;height:22px;color:var(--muted);transition:transform .15s}
.card.open .chev{transform:rotate(180deg)}
.snip{margin:0 14px 12px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.snip div{display:flex;gap:8px;align-items:flex-start}
.snip .dot{flex:none;margin-top:2px}

.body{padding:2px 14px 14px;border-top:1px solid var(--line)}
.lv{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lv:last-of-type{border-bottom:0}
.lv .dot{width:28px;height:28px;font-size:15px}
.lv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45}
.lv .none{color:var(--muted);font-style:italic}
.open-page{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:50px;margin-top:6px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.open-page svg{width:20px;height:20px}
.pgno{margin-top:8px;text-align:center;font-size:13px;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.try{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* viewer */
#viewer{position:fixed;inset:0;z-index:50;background:#0a1118;display:none;flex-direction:column;color:#fff}
#viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#101b26;border-bottom:1px solid #223344}
.vbar .vt{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .vt small{display:block;font-weight:400;color:#9fb1c0;font-size:12px}
.vb{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #33475a;background:#16232f;color:#fff;border-radius:10px;font-weight:500;font-size:15px}
.vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;text-align:center;background:#0a1118}
.vscroll img{display:block;width:100%;max-width:900px;margin:0 auto;height:auto;background:#fff}
.vscroll.z img{width:230%;max-width:none;margin:0}
.vnav{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#101b26;border-top:1px solid #223344}
.vnav .vb{flex:1}
.vb[disabled]{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
#offl{font-size:12px;color:var(--accent);font-weight:500}
#offl:empty{display:none}
</style>
</head>
<body>

<header class="top">
  <div class="stripe" aria-hidden="true"></div>
  <div class="top-in">
    <h1>חוברת הפגמים של נתי</h1>
    <p class="sub">פנקס לסוקר, גשרים ומבני דרך. נתיבי ישראל, מהדורה 1-2016</p>
    <p class="sub" id="offl" aria-live="polite"></p>
  </div>
</header>

<div class="sticky">
  <div class="sticky-in">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" dir="rtl" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="חיפוש פגם או נזק, למשל: סדק, חלודה, סמך" aria-label="חיפוש פגם או נזק">
      <button id="clear" type="button" aria-label="נקה חיפוש"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="סינון לפי קבוצה"></div>
  </div>
</div>

<main>
  <div class="statusbar">
    <span id="count" aria-live="polite"></span>
    <span class="legend" aria-label="דרגות חומרה">
      <span><i class="dot l1">1</i>תקין</span>
      <span><i class="dot l2">2</i>קל</span>
      <span><i class="dot l3">3</i>בינוני</span>
      <span><i class="dot l4">4</i>חמור</span>
      <span><i class="dot l5">5</i>כשל</span>
    </span>
  </div>
  <div id="out"><div class="empty"><p>טוען את רשימת הפגמים…</p></div></div>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="עמוד מהחוברת">
  <div class="vbar">
    <button class="vb" id="vclose" type="button">סגור</button>
    <div class="vt" id="vtitle"></div>
    <button class="vb" id="vzoom" type="button" aria-pressed="false">הגדל</button>
  </div>
  <div class="vscroll" id="vscroll"><img id="vimg" alt=""></div>
  <div class="vnav">
    <button class="vb" id="vprev" type="button">הקודם</button>
    <button class="vb" id="vnext" type="button">הבא</button>
  </div>
</div>

<script>
var FAMS = [
  [1,"רכיבים מתכתיים","Metalwork","מתכת"],
  [2,"רכיבים מבטון מזוין ובטון דרוך","Reinforced & Prestressed Concrete","בטון"],
  [3,"חיפויים","Cladding","חיפויים"],
  [4,"מבני אבן ורכיבים ממסת בטון","Masonry, Brickwork and Mass Concrete","אבן ובנייה"],
  [5,"צבע וציפוי מגן","Paintwork and Protective Coatings","צבע וציפוי"],
  [6,"צמחייה","Vegetation","צמחייה"],
  [7,"יסודות","Foundations","יסודות"],
  [8,"דפנות וקרקעית האפיק/התעלה","Invert, apron & river/canal bed","אפיק ותעלה"],
  [9,"ניקוז","Drainage","ניקוז"],
  [10,"חיפוי פני מיסעה","Surfacing","פני מיסעה"],
  [11,"תפרי התפשטות במיסעות ובקירות","Expansion Joints","תפרי התפשטות"],
  [12,"סוללות ומדרונות משופעים מדופנים/מצופים","Embankments","סוללות"],
  [13,"סמכים","Bearings","סמכים"],
  [14,"נזקי פגיעה מכאנית","Impact Damage","פגיעה מכאנית"],
  [15,"איטום","Waterproofing","איטום"],
  [16,"מבני עץ","Timber","עץ"],
  [17,"פגם אחר","Other Defect","אחר"]
];
var SYN = [
  ["סדק","סדקים","סדיקה","סדוק","סדיקת"],
  ["חלודה","חלוד","חלודים","קורוזיה","שיתוך","גימום","החלדה","קורס"],
  ["נזילה","נזילות","חילחול","רטיבות","הרטבה","הרטבת","מים","דליפה"],
  ["שריפה","שרפה","פיח","אש"],
  ["התנגשות","פגיעה","מכה","פגיעת"],
  ["תפר","תפרים","מישק","מישקים","פוגה","פוגות"],
  ["פלדה","מתכת","ברזל","מתכתי","מתכתיים"],
  ["צבע","ציפוי","גילוון","צביעה"],
  ["קילוף","גומות","התקלפות","קשקשת","קילופים"],
  ["צמחייה","צמחיה","עשבים","שורשים","עשב"],
  ["שקיעה","שקיעת","שקיעות"],
  ["ניקוז","תיעול","נקז","נקזים"],
  ["אספלט","מיסעה","כביש","מיסעות"],
  ["סמך","סמכים","סמכי"],
  ["כשל","הרס","קריסה","התמוטטות"],
  ["אבן","אבנים","בנייה","בניה"],
  ["כיחול","כחול","מישקי"]
];

var DATA = [], FAMMAP = {}, FAMCOUNT = {};
FAMS.forEach(function(f){ FAMMAP[f[0]] = f; });

var state = { q:"", fam:0, open:{}, results:[], viewIdx:-1 };

/* ---------- text helpers ---------- */
var FINAL = {"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
function norm(s){
  return String(s).replace(/[֑-ׇ]/g,"").replace(/[ךםןףץ]/g,function(c){return FINAL[c];}).toLowerCase();
}
function normKeep(s){ // length preserving, for highlight
  return String(s).replace(/[ךםןףץ]/g,function(c){return FINAL[c];}).toLowerCase();
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
var SYNN = SYN.map(function(g){ return g.map(norm); });
function stripPrefix(t){
  if (t.length >= 4 && "והבלמש".indexOf(t.charAt(0)) >= 0) return t.slice(1);
  return t;
}
function alts(term){
  var set = {};
  set[term] = 1;
  var base = stripPrefix(term);
  set[base] = 1;
  SYNN.forEach(function(g){
    var hit = g.some(function(m){
      return m === term || m === base ||
        (base.length >= 3 && m.indexOf(base) === 0) ||
        (m.length >= 3 && base.indexOf(m) === 0);
    });
    if (hit) g.forEach(function(m){ set[m] = 1; });
  });
  return Object.keys(set).filter(function(x){ return x.length > 0; });
}
function parseQuery(q){
  return norm(q).split(/[\s,;]+/).filter(Boolean).map(function(t){ return { t:t, alts:alts(t) }; });
}
function hl(text, terms){
  var raw = String(text);
  if (!terms || !terms.length) return esc(raw);
  var n = normKeep(raw);
  var marks = [];
  terms.forEach(function(tm){
    tm.alts.forEach(function(a){
      var i = n.indexOf(a);
      while (i >= 0){ marks.push([i, i + a.length]); i = n.indexOf(a, i + a.length); }
    });
  });
  if (!marks.length) return esc(raw);
  marks.sort(function(x,y){ return x[0]-y[0] || y[1]-x[1]; });
  var out = "", pos = 0;
  marks.forEach(function(m){
    if (m[1] <= pos) return;
    var s = Math.max(m[0], pos);
    out += esc(raw.slice(pos, s)) + "<mark>" + esc(raw.slice(s, m[1])) + "</mark>";
    pos = m[1];
  });
  return out + esc(raw.slice(pos));
}

/* ---------- search ---------- */
function prepare(d){
  var f = FAMMAP[d.fam];
  d._title = norm(d.title + " " + d.en + " " + d.code);
  d._fam = norm(f[1] + " " + f[2] + " " + f[3]);
  d._lv = d.levels.map(function(l){ return norm(l.join(" ")); });
  d._body = d._lv.join(" ");
}
function score(d, terms){
  var total = 0;
  for (var i = 0; i < terms.length; i++){
    var best = 0;
    for (var j = 0; j < terms[i].alts.length; j++){
      var a = terms[i].alts[j];
      var isExact = j === 0 || a === terms[i].t;
      var s = 0;
      var ti = d._title.indexOf(a);
      if (ti >= 0) s = Math.max(s, (ti === 0 || d._title.charAt(ti-1) === " ") ? 14 : 10);
      if (!isExact && s) s = Math.max(1, s - 4);
      if (d._fam.indexOf(a) >= 0) s = Math.max(s, isExact ? 5 : 3);
      if (d._body.indexOf(a) >= 0) s = Math.max(s, isExact ? 3 : 2);
      if (s > best) best = s;
    }
    if (!best) return 0;
    total += best;
  }
  return total;
}
function run(){
  var terms = parseQuery(state.q);
  var list = DATA.filter(function(d){ return !state.fam || d.fam === state.fam; });
  if (terms.length){
    var scored = [];
    list.forEach(function(d){
      var s = score(d, terms);
      if (s) scored.push([s, d]);
    });
    scored.sort(function(a,b){ return b[0]-a[0] || a[1].id - b[1].id; });
    list = scored.map(function(x){ return x[1]; });
  }
  state.results = list;
  return terms;
}

/* ---------- render ---------- */
var elOut = document.getElementById("out");
var elCount = document.getElementById("count");
var elChips = document.getElementById("chips");
var elQ = document.getElementById("q");
var elClear = document.getElementById("clear");

var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>';

function levelHtml(d, terms){
  var out = "";
  for (var i = 0; i < 5; i++){
    var items = d.levels[i] || [];
    out += '<div class="lv"><i class="dot l' + (i+1) + '">' + (i+1) + '</i>';
    if (items.length){
      out += "<ul>" + items.map(function(t){ return '<li dir="auto">' + hl(t, terms) + "</li>"; }).join("") + "</ul>";
    } else {
      out += '<ul><li class="none">אין תיאור לדרגה זו בחוברת</li></ul>';
    }
    out += "</div>";
  }
  return out;
}
function snippets(d, terms){
  if (!terms.length) return "";
  var inTitle = terms.every(function(tm){ return tm.alts.some(function(a){ return d._title.indexOf(a) >= 0 || d._fam.indexOf(a) >= 0; }); });
  if (inTitle) return "";
  var rows = [];
  for (var i = 0; i < 5 && rows.length < 2; i++){
    var items = d.levels[i] || [];
    for (var k = 0; k < items.length && rows.length < 2; k++){
      var n = norm(items[k]);
      var ok = terms.some(function(tm){ return tm.alts.some(function(a){ return n.indexOf(a) >= 0; }); });
      if (ok) rows.push('<div><i class="dot l' + (i+1) + '">' + (i+1) + '</i><span dir="auto">' + hl(items[k], terms) + "</span></div>");
    }
  }
  return rows.length ? '<div class="snip">' + rows.join("") + "</div>" : "";
}
function cardHtml(d, terms){
  var f = FAMMAP[d.fam];
  var open = !!state.open[d.id];
  var h = '<div class="card' + (open ? " open" : "") + '" data-id="' + d.id + '">';
  h += '<button class="head" type="button" aria-expanded="' + open + '" aria-controls="b' + d.id + '">';
  h += '<span class="code">' + esc(d.code) + "</span>";
  h += '<span><span class="ttl">' + hl(d.title, terms) + "</span>";
  if (d.en) h += '<div class="en" dir="auto">' + hl(d.en, terms) + "</div>";
  h += '<div class="meta">' + esc(f[3]) + " · עמ׳ " + d.book + "</div></span>";
  h += CHEV + "</button>";
  if (!open) h += snippets(d, terms);
  h += '<div class="body" id="b' + d.id + '"' + (open ? "" : " hidden") + ">";
  h += levelHtml(d, terms);
  h += '<button class="open-page" type="button" data-view="' + d.id + '">' + IMG + "פתח את העמוד עם התמונות</button>";
  h += '<div class="pgno">עמוד ' + d.book + " בחוברת, עמוד " + d.pdf + " בקובץ</div>";
  h += "</div></div>";
  return h;
}
function render(){
  var terms = run();
  var hasQ = terms.length > 0;
  var res = state.results;
  if (hasQ && res.length && !Object.keys(state.open).some(function(k){ return res.some(function(d){ return d.id == k; }); })){
    state.open = {}; state.open[res[0].id] = true;
  }
  elCount.textContent = hasQ || state.fam
    ? (res.length ? "נמצאו " + res.length + " פגמים" : "לא נמצאו פגמים")
    : DATA.length + " פגמים ב-17 קבוצות";
  var h = "";
  if (!res.length){
    h = '<div class="empty"><p>לא נמצא פגם שמתאים לחיפוש. נסה מילה אחרת, שם קצר יותר או קבוצה אחרת.</p><div class="try">' +
      ["סדק","חלודה","סמך","תפר","נזילה","שריפה"].map(function(w){ return '<button class="chip" type="button" data-try="' + w + '">' + w + "</button>"; }).join("") + "</div></div>";
  } else if (!hasQ && !state.fam){
    var cur = 0;
    res.forEach(function(d){
      if (d.fam !== cur){
        if (cur) h += "</div>";
        cur = d.fam;
        var f = FAMMAP[cur];
        h += '<h2 class="group-h">' + esc(f[1]) + ' <small>' + esc(f[2]) + '</small></h2><div class="list">';
      }
      h += cardHtml(d, terms);
    });
    h += "</div>";
  } else {
    h = '<div class="list">' + res.map(function(d){ return cardHtml(d, terms); }).join("") + "</div>";
  }
  elOut.innerHTML = h;
  elClear.classList.toggle("on", state.q.length > 0);
}
function renderChips(){
  var h = '<button class="chip" type="button" data-fam="0" aria-pressed="' + (state.fam === 0) + '">הכל<b>' + DATA.length + "</b></button>";
  FAMS.forEach(function(f){
    h += '<button class="chip" type="button" data-fam="' + f[0] + '" aria-pressed="' + (state.fam === f[0]) + '">' + esc(f[3]) + "<b>" + (FAMCOUNT[f[0]] || 0) + "</b></button>";
  });
  elChips.innerHTML = h;
}

/* ---------- events ---------- */
elQ.addEventListener("input", function(){
  state.q = elQ.value;
  state.open = {};
  render();
});
elClear.addEventListener("click", function(){
  elQ.value = ""; state.q = ""; state.open = {};
  render(); elQ.focus();
});
elChips.addEventListener("click", function(e){
  var b = e.target.closest("[data-fam]");
  if (!b) return;
  state.fam = parseInt(b.getAttribute("data-fam"), 10);
  state.open = {};
  renderChips(); render();
  window.scrollTo(0, 0);
});
elOut.addEventListener("click", function(e){
  var t = e.target.closest("[data-try]");
  if (t){ elQ.value = t.getAttribute("data-try"); state.q = elQ.value; state.open = {}; render(); return; }
  var v = e.target.closest("[data-view]");
  if (v){ openViewer(parseInt(v.getAttribute("data-view"), 10)); return; }
  var head = e.target.closest(".head");
  if (head){
    var card = head.parentNode;
    var id = card.getAttribute("data-id");
    var open = !state.open[id];
    if (open) state.open[id] = true; else delete state.open[id];
    card.classList.toggle("open", open);
    head.setAttribute("aria-expanded", open);
    card.querySelector(".body").hidden = !open;
    var sn = card.querySelector(".snip");
    if (sn) sn.hidden = open;
  }
});

/* ---------- viewer ---------- */
var elV = document.getElementById("viewer");
var elVimg = document.getElementById("vimg");
var elVscroll = document.getElementById("vscroll");
var elVtitle = document.getElementById("vtitle");
var elVzoom = document.getElementById("vzoom");
var elVprev = document.getElementById("vprev");
var elVnext = document.getElementById("vnext");
var lastFocus = null;
function pad(n){ n = String(n); while (n.length < 3) n = "0" + n; return n; }
function showView(i){
  var d = state.results[i];
  if (!d) return;
  state.viewIdx = i;
  elVimg.src = "p-" + pad(d.pdf) + ".jpg";
  elVimg.alt = "עמוד " + d.book + " בחוברת: " + d.title;
  elVtitle.innerHTML = esc(d.code + "  " + d.title) + "<small>עמוד " + d.book + " בחוברת</small>";
  elVscroll.scrollTop = 0; elVscroll.scrollLeft = 0;
  elVprev.disabled = i <= 0;
  elVnext.disabled = i >= state.results.length - 1;
}
function openViewer(id){
  var i = state.results.findIndex(function(d){ return d.id === id; });
  if (i < 0) return;
  lastFocus = document.activeElement;
  setZoom(false);
  showView(i);
  elV.classList.add("on");
  document.body.style.overflow = "hidden";
  document.getElementById("vclose").focus();
}
function closeViewer(){
  elV.classList.remove("on");
  document.body.style.overflow = "";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function setZoom(on){
  elVscroll.classList.toggle("z", on);
  elVzoom.setAttribute("aria-pressed", on);
  elVzoom.textContent = on ? "הקטן" : "הגדל";
}
document.getElementById("vclose").addEventListener("click", closeViewer);
elVzoom.addEventListener("click", function(){ setZoom(!elVscroll.classList.contains("z")); });
elVprev.addEventListener("click", function(){ showView(state.viewIdx - 1); });
elVnext.addEventListener("click", function(){ showView(state.viewIdx + 1); });
document.addEventListener("keydown", function(e){
  if (!elV.classList.contains("on")) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowLeft") showView(state.viewIdx + 1);
  else if (e.key === "ArrowRight") showView(state.viewIdx - 1);
});

window.addEventListener("error", function(e){
  if (!DATA.length) elOut.innerHTML = '<div class="empty"><p>אירעה שגיאה בטעינה. רענן את העמוד.</p><p dir="ltr">' + esc(e.message || "") + "</p></div>";
});
/* ---------- start ---------- */
fetch("data.json").then(function(r){ return r.json(); }).then(function(rows){
  DATA = rows;
  DATA.forEach(function(d){ prepare(d); FAMCOUNT[d.fam] = (FAMCOUNT[d.fam] || 0) + 1; });
  renderChips();
  render();
  elQ.focus({ preventScroll:true });
}).catch(function(){
  elOut.innerHTML = '<div class="empty"><p>טעינת רשימת הפגמים נכשלה. רענן את העמוד.</p></div>';
});
</script>
<script>
(function(){
  var el = document.getElementById("offl");
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
    navigator.serviceWorker.ready.then(function(reg){
      if (reg.active) reg.active.postMessage("cache-images");
    }).catch(function(){});
    var tries = 0;
    function check(){
      if (!window.caches) return;
      caches.open("nati-pgamim-v2").then(function(c){ return c.keys(); }).then(function(keys){
        var n = keys.filter(function(r){ return /p-\d+\.jpg$/.test(r.url); }).length;
        if (n >= 137){ el.textContent = "✓ נשמר בטלפון, עובד גם בלי אינטרנט"; return; }
        el.textContent = n ? "שומר לשימוש בלי אינטרנט: " + n + " מתוך 137" : "";
        if (++tries < 300) setTimeout(check, 2000);
      }).catch(function(){});
    }
    setTimeout(check, 2500);
  });
})();
</script>
